<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sunday Loaf Bakery</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Header  -->
         <header>
            <a href="#" class="logo">
                <i class="fa-solid fa-bread-slice"></i> Sunday Loaf</a>
            <nav>
                <a href="#menu">Menu</a>
                <a href="#contact">Contact</a>
            </nav>
         </header>

         <section class="hero">
            <div>
                <h1>Fresh bread, baked before sunrise.</h1>
                <p>Sourdough, pasteries and coffee from our corner shop in Aba</p>
                <a href="#menu" class="btn">See the menu</a>
            </div>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsKpyrqi5N1so4MvxzCmNT3TaI56KwIfZqnI2Dbpy0aA&s=10" alt="Freash bread">
         </section>

         <!-- Sections -->
          <section class="features">
            <h2>Today's menu</h2>
            <div><i class="fa-solid fa-wheat-awn"></i><h3>Real ingredients</h3></div>
            <div><i class="fa-solid fa-fire-burner"></i><h3>Baked daily</h3></div>
            <div><i class="fa-solid fa-motorcycle"></i><h3>Fast delivery</h3></div>
          </section>


          <section id="menu" class="menu">
            <h2>Today's menu</h2>
            <div class="menu-images">
                <article class="card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQsDnlyG6SMm2KtmTOJFtwwfXjJccyJ3SY8ojGp_iNS6Q&s=10" alt="Sourdough">
                    <h3>Sourdough</h3>
                    <p>$20</p>
                </article>

                <article class="card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToECex9ISe2y5vGgT_A1VEGNd_2mk9qIn02-2maZ9GfQ&s=10" alt="Croissant">
                    <h3>Croissant</h3>
                    <p>$5</p>
                </article>

                <article class="card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTZ_ZYUM89w3LaAvBd5eS9zv8EqgMW0ZLpJsKr3mysvSQ&s=10" alt="Coffee">
                    <h3>Coffee</h3>
                    <p>$2</p>
                </article>
            </div>
          </section>

          <footer id="contact">
            <p><i class=""></i>12 Amah Henry way, Aba</p>
            <p>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-x-twitter"></i>
                <i class="fa-brands fa-whatsapp"></i>
            </p>
          </footer>
    </body>
</html>
